services:
  # --- Selenoid ---
  selenoid:
    image: aerokube/selenoid:latest
    container_name: selenoid
    restart: unless-stopped
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./config/:/etc/selenoid/:ro"   # твой browsers.json
    ports:
      - "4444:4444"
    networks:
      - selenoid_net
    command: [
      "-limit", "4",
      "-conf", "/etc/selenoid/browsers.json",
      "-container-network", "selenoid_net"
    ]

  # --- Selenoid UI ---
  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    container_name: selenoid-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - selenoid_net
    command: ["--selenoid-uri", "http://selenoid:4444"]

  # --- Тесты ---
  test-run:
    build:
      context: .
      dockerfile: Dockerfile   # твой Maven + Java образ
    container_name: tests
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      selenoid:
        condition: service_started
      selenoid-ui:
        condition: service_started
    networks:
      - selenoid_net
#    command: tail -f /dev/null  # контейнер не завершится сам

networks:
  selenoid_net:
    name: selenoid_net
    driver: bridge