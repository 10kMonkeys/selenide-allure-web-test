services:
  # --- Selenoid ---
  selenoid:
    image: aerokube/selenoid:latest
    container_name: selenoid
    restart: unless-stopped
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./config/:/etc/selenoid/:ro"   # тут лежит твой browsers.json
    ports:
      - "4444:4444"
    networks:
      - selenoid_net
    command: [
      "-limit", "4",
      "-conf", "/etc/selenoid/browsers.json",
      "-container-network", "selenoid_net"
    ]

  # --- Selenoid UI ---
  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    container_name: selenoid-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - selenoid_net
    command: ["--selenoid-uri", "http://selenoid:4444"]

  # --- Тесты ---
  test-run:
    build:
      context: .
      dockerfile: Dockerfile   # твой Dockerfile с Maven + Java 21
    container_name: tests
    working_dir: /usr/src/app  # директория с проектом внутри контейнера
    volumes:
      - ./:/usr/src/app        # монтируем твой проект (pom.xml, src/...) внутрь контейнера
    depends_on:
      - selenoid
    networks:
      - selenoid_net
    command: tail -f /dev/null

    # --- Общая сеть ---
networks:
  selenoid_net:
    name: selenoid_net       # имя сети в Docker, а не project_default
    driver: bridge